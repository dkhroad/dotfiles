# Gruvbox light (hard) — i3 window borders + bar. Selected via the theme.conf
# symlink, swapped by ~/.config/i3/bin/theme-switch.

# class                 border  backgr. text    indicator child_border
client.focused          #458588 #458588 #f9f5d7 #076678 #458588
client.focused_inactive #ebdbb2 #ebdbb2 #504945 #ebdbb2 #ebdbb2
client.unfocused        #f2e5bc #f2e5bc #7c6f64 #f2e5bc #f2e5bc
client.urgent           #9d0006 #9d0006 #f9f5d7 #9d0006 #9d0006
client.placeholder      #ebdbb2 #ebdbb2 #3c3836 #ebdbb2 #ebdbb2
client.background       #f9f5d7

bar {
    status_command i3status
    font pango:DejaVu Sans Mono 8
    colors {
        background #ebdbb2
        statusline #3c3836
        separator  #427b58
        #                  border  backgr. text
        focused_workspace  #458588 #458588 #f9f5d7
        active_workspace   #d5c4a1 #d5c4a1 #3c3836
        inactive_workspace #ebdbb2 #ebdbb2 #7c6f64
        urgent_workspace   #9d0006 #9d0006 #f9f5d7
    }
}
