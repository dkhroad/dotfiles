# Gruvbox dark — i3 window borders + bar. Selected via the theme.conf symlink,
# swapped by ~/.config/i3/bin/theme-switch. The bar{} block lives here so its
# colors switch together with the window-border colors.

# class                 border  backgr. text    indicator child_border
client.focused          #458588 #458588 #ebdbb2 #83a598 #458588
client.focused_inactive #3c3836 #3c3836 #a89984 #3c3836 #3c3836
client.unfocused        #282828 #282828 #7c6f64 #282828 #282828
client.urgent           #cc241d #cc241d #fbf1c7 #cc241d #cc241d
client.placeholder      #1d2021 #1d2021 #ebdbb2 #1d2021 #1d2021
client.background       #282828

bar {
    status_command i3status
    font pango:DejaVu Sans Mono 12
    colors {
        background #1d2021
        statusline #ebdbb2
        separator  #689d6a
        #                  border  backgr. text
        focused_workspace  #458588 #458588 #1d2021
        active_workspace   #3c3836 #3c3836 #ebdbb2
        inactive_workspace #1d2021 #1d2021 #a89984
        urgent_workspace   #cc241d #cc241d #fbf1c7
    }
}
