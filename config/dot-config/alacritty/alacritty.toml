[general]
import = [
    # active.toml is a symlink swapped by ~/.config/i3/bin/theme-switch
    # (gruvbox_dark <-> gruvbox_light_hard); touching this file forces reload.
    "~/.config/alacritty/active.toml"
]

[env]
TERM = "xterm-256color"


[window]
padding.x = 10
padding.y = 10
dynamic_padding = true

decorations = "none"
# dynamic_title = true

opacity = 1.0
blur = false

option_as_alt = "Both"

[font]
normal.family = "MesloLGS Nerd Font Mono"
# normal.family = "VictorMono Nerd Font Mono"
# normal.family = "UbuntuMono Nerd Font Mono"
# normal.family = "DroidSansMono Nerd font"

size = 11
